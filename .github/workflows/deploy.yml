name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: 64.176.66.50
      DEPLOY_PORT: "22"
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_PATH: /opt/slotsone
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PRODUCTION_URL: https://pyavchikstream.online
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${DEPLOY_SSH_KEY_B64}" ]; then
            printf '%s' "${DEPLOY_SSH_KEY_B64}" | base64 -d > ~/.ssh/id_ed25519
          elif [ -n "${DEPLOY_SSH_KEY}" ]; then
            printf '%s' "${DEPLOY_SSH_KEY}" | tr -d '\r' | perl -pe 's/\\n/\n/g' > ~/.ssh/id_ed25519
          else
            echo 'Missing production SSH key secret'
            exit 1
          fi

          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          test -n "${DEPLOY_KNOWN_HOSTS}" || { echo 'Missing DEPLOY_KNOWN_HOSTS'; exit 1; }
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF

      - name: Check production access
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && test -f .env.production && test -f backend/.env.production && test -f admin/.env.production && docker info >/dev/null"

      - name: Build release images
        run: |
          set -euo pipefail
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "slotsone-backend:$GITHUB_SHA" backend
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg "APP_REVISION=$GITHUB_SHA" \
            -t "slotsone-frontend:$GITHUB_SHA" frontend
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "slotsone-admin:$GITHUB_SHA" admin

      - name: Load images on production server
        run: |
          set -euo pipefail
          docker save "slotsone-backend:$GITHUB_SHA" "slotsone-frontend:$GITHUB_SHA" "slotsone-admin:$GITHUB_SHA" \
            | gzip -1 \
            | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'set -o pipefail; gzip -d | docker load'

      - name: Sync deployment configuration
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/ops/server'"
          rsync -az --inplace -e "ssh -p $DEPLOY_PORT" \
            Caddyfile docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          rsync -az -e "ssh -p $DEPLOY_PORT" \
            ops/server/compose.prebuilt.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/ops/server/"

      - name: Start release and verify containers
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$GITHUB_SHA" "$DEPLOY_PATH" < ops/server/deploy-prebuilt.sh

      - name: Verify public deployment
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "$PRODUCTION_URL/ready" > /tmp/slotsone-ready.json
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "$PRODUCTION_URL/version.json?commit=$GITHUB_SHA" > /tmp/slotsone-version.json
          python3 - <<'PYCODE'
          import json, os
          with open('/tmp/slotsone-ready.json') as file:
              assert json.load(file)['status'] == 'ready', 'Production is not ready'
          with open('/tmp/slotsone-version.json') as file:
              assert json.load(file)['commit'] == os.environ['GITHUB_SHA'], 'Production revision mismatch'
          print('Verified live commit:', os.environ['GITHUB_SHA'])
          PYCODE
          curl --fail --silent --show-error "$PRODUCTION_URL/" >/dev/null
          curl --fail --silent --show-error "$PRODUCTION_URL/admin/login" >/dev/null
          {
            echo '### Production deployed'
            echo "- Site: $PRODUCTION_URL"
            echo "- Commit: $GITHUB_SHA"
            echo '- Readiness, release version, home page, and admin login verified.'
          } >> "$GITHUB_STEP_SUMMARY"
