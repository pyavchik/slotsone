name: qa-api-typescript

on:
  pull_request:
    paths:
      - "qa/**"
      - "backend/**"
      - ".github/workflows/qa-api-typescript.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "qa/**"
      - "backend/**"
      - ".github/workflows/qa-api-typescript.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  api:
    name: API tests (TypeScript + Playwright)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: slotsone
          POSTGRES_USER: slotsone
          POSTGRES_PASSWORD: slotsone
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - "5432:5432"
    env:
      API_URL: http://localhost:3001
      DATABASE_URL: postgres://slotsone:slotsone@localhost:5432/slotsone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            qa/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Generate ephemeral RS256 JWT keypair
        working-directory: backend
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt_private.pem
          openssl rsa -in jwt_private.pem -pubout -out jwt_public.pem

      - name: Start backend
        working-directory: backend
        run: |
          export JWT_PRIVATE_KEY="$(cat jwt_private.pem)"
          export JWT_PUBLIC_KEY="$(cat jwt_public.pem)"
          nohup node dist/index.js > backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3001/ready >/dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 1
          done
          echo "backend failed to start"
          tail -n 200 backend.log || true
          exit 1
        env:
          PORT: "3001"
          JWT_ALLOWED_ALGS: RS256
          JWT_ISSUER: slotsone-dev
          JWT_AUDIENCE: slotsone-client

      - name: Install TypeScript API test dependencies
        working-directory: qa
        run: npm ci

      - name: Run TypeScript API tests
        working-directory: qa
        run: npm run test:api:playwright

      - name: Generate Allure HTML report
        if: always()
        working-directory: qa
        run: npm run report:api:allure

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-typescript-api-allure-results
          path: qa/allure-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-typescript-api-allure-report
          path: qa/allure-report
          if-no-files-found: ignore
          retention-days: 30

      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload TypeScript API report to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: qa/allure-report

      - name: Deploy TypeScript API report to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-typescript-api-backend-log
          path: backend/backend.log
          if-no-files-found: ignore
